<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>理想机 · Logo 开屏预览</title>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;background:#fff}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fff}
.preview{position:relative;width:100%;height:100%;overflow:hidden;background:#fff;isolation:isolate}
.desktop{position:absolute;inset:0;z-index:1;display:block;width:100%;height:100%;border:0;background:transparent;opacity:1}
.boot{position:absolute;inset:0;z-index:2;display:grid;place-items:center;background:#fff}
.boot-inner{display:grid;justify-items:center;gap:25px;transform:translateY(-2vh)}
.logo-cluster{position:relative;display:grid;place-items:center;width:122px;height:96px;color:#171717;opacity:0;will-change:opacity}
.logo{display:block;width:58px;height:58px;overflow:visible;color:#171717;transform-origin:center;will-change:transform}
.logo path{fill:#fff;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.spark{position:absolute;display:block;background:#171717;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);opacity:.18;transform:scale(.76);will-change:opacity,transform}
.spark-one{top:9px;right:21px;width:8px;height:8px}.spark-two{top:34px;left:12px;width:11px;height:11px}.spark-three{right:8px;bottom:17px;width:6px;height:6px}.spark-four{left:29px;bottom:6px;width:7px;height:7px}
.progress{position:relative;width:126px;height:3px;overflow:hidden;border-radius:99px;background:rgba(20,20,20,.13);opacity:0}
.progress i{position:absolute;inset:0 auto 0 0;width:0;border-radius:inherit;background:#171717;will-change:width}
.boot.is-playing .logo-cluster{animation:cluster-awake 3.28s cubic-bezier(.25,.65,.25,1) forwards}
.boot.is-playing .logo{animation:logo-hop 3.06s linear .20s forwards}
.boot.is-playing .spark-one{animation:spark-breathe 1.18s ease-in-out .28s 3}
.boot.is-playing .spark-two{animation:spark-breathe 1.34s ease-in-out .46s 2}
.boot.is-playing .spark-three{animation:spark-breathe 1.05s ease-in-out .67s 3}
.boot.is-playing .spark-four{animation:spark-breathe 1.28s ease-in-out .82s 2}
.boot.is-playing .progress{animation:progress-awake 3.18s ease .28s forwards}
.boot.is-playing .progress i{animation:progress-fill 2.72s cubic-bezier(.18,.62,.22,1) .48s forwards}
@keyframes cluster-awake{0%{opacity:0}8%,88%{opacity:1}100%{opacity:0}}
@keyframes logo-hop{
  0%{transform:translate(0,0) rotate(0) scale(1);animation-timing-function:cubic-bezier(.35,0,.72,.35)}
  7%{transform:translate(-.15px,.5px) rotate(-.08deg) scale(.965,1.035);animation-timing-function:cubic-bezier(.18,.72,.22,1)}
  19%{transform:translate(-.6px,-5px) rotate(-.55deg) scale(.995,1.008);animation-timing-function:cubic-bezier(.68,0,.82,.62)}
  31%{transform:translate(.25px,.8px) rotate(.18deg) scale(1.025,.975);animation-timing-function:cubic-bezier(.2,.65,.28,1)}
  42%{transform:translate(0,-2.7px) rotate(.18deg) scale(.998,1.004);animation-timing-function:cubic-bezier(.68,0,.82,.7)}
  53%{transform:translate(.15px,.25px) rotate(-.08deg) scale(1.012,.988);animation-timing-function:cubic-bezier(.2,.65,.3,1)}
  64%{transform:translate(0,-1.15px) rotate(-.06deg) scale(1,1);animation-timing-function:cubic-bezier(.58,0,.82,.72)}
  75%{transform:translate(-.08px,.12px) rotate(0) scale(1.004,.996);animation-timing-function:cubic-bezier(.25,.62,.3,1)}
  86%{transform:translate(0,-.35px) rotate(0) scale(1,1);animation-timing-function:cubic-bezier(.25,.62,.3,1)}
  100%{transform:translate(0,0) rotate(0) scale(1)}
}
@keyframes spark-breathe{0%,100%{opacity:.12;transform:scale(.72)}50%{opacity:.72;transform:scale(1)}}
@keyframes progress-awake{0%{opacity:0}8%,88%{opacity:1}100%{opacity:0}}
@keyframes progress-fill{0%{width:0}18%{width:12%}48%{width:46%}72%{width:68%}90%{width:91%}100%{width:100%}}
.replay{position:fixed;right:max(15px,env(safe-area-inset-right));bottom:max(15px,env(safe-area-inset-bottom));z-index:6;display:none;min-width:72px;height:34px;padding:0 14px;border:1px solid rgba(25,25,25,.1);border-radius:11px;background:rgba(248,247,244,.84);color:#55514d;box-shadow:0 8px 25px rgba(0,0,0,.1);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);font:11px/1 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;cursor:pointer}.replay.is-visible{display:block;animation:replay-in .24s ease both}.replay:active{transform:scale(.97)}
@keyframes replay-in{from{opacity:0;transform:translateY(5px)}to{opacity:.78;transform:none}}
@media(max-width:430px){.logo{width:52px;height:52px}.logo-cluster{width:112px;height:90px}}
@media(prefers-reduced-motion:reduce){.desktop{opacity:1}.boot,.replay{display:none!important}}
</style>
</head>
<body>
<main class="preview" id="preview">
  <iframe class="desktop" id="desktop" src="../index.html" title="理想机真实桌面"></iframe>
  <section class="boot" id="boot" aria-label="理想机正在启动">
    <div class="boot-inner">
      <div class="logo-cluster">
        <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M32 7.8 C33.1 7.7 34 8.4 34.5 9.5 L39.4 21.1 L52 22.4 C54.1 22.6 55 25.1 53.3 26.6 L43.7 35 L46.5 47.2 C47 49.3 44.8 50.7 43 49.6 L32 43.2 L21 49.6 C19.2 50.7 17 49.3 17.5 47.2 L20.3 35 L10.7 26.6 C9 25.1 9.9 22.6 12 22.4 L24.6 21.1 L29.5 9.5 C30 8.4 30.9 7.7 32 7.8 Z"></path>
        </svg>
        <i class="spark spark-one"></i><i class="spark spark-two"></i><i class="spark spark-three"></i><i class="spark spark-four"></i>
      </div>
      <span class="progress" aria-hidden="true"><i></i></span>
    </div>
  </section>
  <button class="replay" id="replay" type="button">重新播放</button>
</main>
<script>
(() => {
  const preview=document.querySelector('#preview');
  const desktop=document.querySelector('#desktop');
  const boot=document.querySelector('#boot');
  const replay=document.querySelector('#replay');
  let started=false,finishTimer=0;

  function reset(){
    clearTimeout(finishTimer);
    preview.classList.remove('is-playing');boot.classList.remove('is-playing');replay.classList.remove('is-visible');
    boot.getAnimations().forEach(animation=>animation.cancel());
    boot.querySelectorAll('*').forEach(node=>node.getAnimations().forEach(animation=>animation.cancel()));
    boot.style.opacity='1';boot.style.display='grid';
    void preview.offsetWidth;
  }

  function play(){
    if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    reset();preview.classList.add('is-playing');boot.classList.add('is-playing');
    finishTimer=setTimeout(()=>{
      // 开屏层直接彻底移除，不用白色半透明层覆盖桌面，避免颜色污染。
      boot.style.display='none';
      preview.classList.remove('is-playing');boot.classList.remove('is-playing');replay.classList.add('is-visible');
    },3600);
  }

  function startOnce(){
    if(started)return;started=true;
    try {
      desktop.contentWindow.sessionStorage.setItem('ideal-machine-launcher-setup-seen-v2','1');
      const setup=desktop.contentDocument?.querySelector('.launcher-setup');
      setup?.classList.remove('is-open');setup?.setAttribute('aria-hidden','true');
    } catch {}
    setTimeout(play,300);
  }

  replay.addEventListener('click',play);
  desktop.addEventListener('load',startOnce,{once:true});
  setTimeout(startOnce,900);
})();
</script>
</body>
</html>
